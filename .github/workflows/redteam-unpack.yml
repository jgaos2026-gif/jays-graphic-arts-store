name: Redteam unpack (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack redteam zip and commit
        run: |
          set -euo pipefail
          ZIP="push-jays-graphic-arts-store-round3.zip"
          test -f "$ZIP"
          unzip -l "$ZIP"
          unzip -o "$ZIP"
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$f" ]; then
              echo "===== BEGIN $f ====="
              cat "$f"
              echo "===== END $f ====="
            fi
          done
          rm -f .github/workflows/test.yml
          rm -f "$ZIP"
          rm -f .github/workflows/redteam-unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "fix(redteam): round-3 fixes from second adversarial audit"
          git push
